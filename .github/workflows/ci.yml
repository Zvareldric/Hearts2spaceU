name: CI

# The checklist docs/07 already requires before every merge — format, analyze,
# test — run by the repo instead of by memory.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/hearts2spaceu

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed against, so CI can
          # never disagree with the local machine about what passes.
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
